[workspace]
members = ["contracts/escrow"]

[package]
name = "remitx"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.0"
soroban-sdk-macros = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[[bin]]
name = "remitx"
path = "src/bin/remitx.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
